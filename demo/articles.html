<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울시장 선거 기사 모아보기</title>
  <style>
    :root{color-scheme:light;--ink:#15283a;--muted:#516575;--line:#d7e0e3;--accent:#075a64;font-family:system-ui,sans-serif;background:#f4f6f5;color:var(--ink)}
    *{box-sizing:border-box}body{margin:0}a{color:var(--accent)}a:focus-visible,button:focus-visible,article:focus-visible{outline:3px solid #07838d;outline-offset:4px}
    .masthead{background:linear-gradient(115deg,#101f35,#173e49);color:#fff;padding:24px max(6vw,18px) 43px}
    .masthead a{color:#cce9e8;font-size:.9rem}.masthead h1{font-family:Georgia,Batang,serif;font-size:clamp(2.35rem,6vw,4.6rem);margin:32px 0 8px;letter-spacing:-.045em}.masthead p{margin:0;color:#d2e3e6;line-height:1.6}
    main{max-width:1200px;margin:auto;padding:30px max(3vw,16px) 60px}
    .layout{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(0,1.55fr);gap:24px;align-items:start}
    .groups,.reader{background:#fff;border:1px solid var(--line);border-radius:16px}
    .groups{padding:20px}.group + .group{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
    .group h2{font-size:1.04rem;margin:0 0 8px}.group ul{list-style:none;padding:0;margin:0}
    .group button{display:block;width:100%;border:0;border-radius:8px;background:none;text-align:left;padding:10px;color:var(--ink);font:inherit;line-height:1.45;cursor:pointer}.group button:hover,.group button[aria-current=true]{background:#e6f3f1;color:#064e55}
    .date,.empty,#archive-status{font-size:.84rem;color:var(--muted)}.date{display:block;margin-top:3px}.empty{margin:0}
    .reader{padding:clamp(20px,4vw,48px);min-height:310px;border-top:4px solid var(--accent)}
    .reader h2{font-family:Georgia,Batang,serif;font-size:clamp(1.65rem,4vw,2.85rem);letter-spacing:-.035em;margin:0 0 16px;overflow-wrap:anywhere}
    .reader p{font-size:1.04rem;white-space:pre-line;line-height:1.85;overflow-wrap:anywhere}.reader footer{color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:26px;font-size:.85rem}
    #archive-status:empty{display:none}
    @media(max-width:700px){.layout{grid-template-columns:1fr;gap:14px}.masthead{padding-bottom:30px}.reader{min-height:220px}}
  </style>
</head>
<body>
  <header class="masthead">
    <a href="index.html">← 개표 대시보드</a>
    <h1>기사 모아보기</h1>
    <p>서울시장 모의 개표와 주거 공약 기사 · 교육용 시뮬레이션</p>
  </header>
  <main>
    <p id="archive-status" role="status"></p>
    <div class="layout">
      <nav class="groups" aria-label="기사 목록">
        <section class="group" id="previous-articles" aria-labelledby="count-heading">
          <h2 id="count-heading">모의 개표 기사</h2>
          <ul id="count-list"></ul><p class="empty" id="count-empty">공개된 개표 기사가 없습니다.</p>
        </section>
        <section class="group" aria-labelledby="followup-heading">
          <h2 id="followup-heading">개표 후속기사</h2>
          <ul id="followup-list"></ul><p class="empty" id="followup-empty">공개된 후속기사가 없습니다.</p>
        </section>
        <section class="group" aria-labelledby="housing-heading">
          <h2 id="housing-heading">공약 기사</h2>
          <ul id="housing-list"></ul><p class="empty" id="housing-empty">공개된 공약 기사가 없습니다.</p>
        </section>
      </nav>
      <article class="reader" id="reader" tabindex="-1" aria-labelledby="article-title">
        <h2 id="article-title">읽을 기사를 선택해 주세요</h2>
        <p id="article-body"></p>
        <footer id="article-source" hidden></footer>
      </article>
    </div>
  </main>
  <script src="vote-drafts.js"></script>
  <script>
    const get = id => document.getElementById(id);
    const clock = new Intl.DateTimeFormat('ko-KR', {
      dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Seoul'
    });
    const groups = ['count', 'followup', 'housing'];
    let articles = [];

    function openArticle(id, focus = false) {
      const item = articles.find(article => article.id === id);
      if (!item) return;
      get('article-title').textContent = item.title;
      get('article-body').textContent = item.body;
      const source = [item.simulated_at && '가상 집계 시각 ' + clock.format(new Date(item.simulated_at)), item.source]
        .filter(Boolean).join(' · ');
      get('article-source').textContent = source;
      get('article-source').hidden = !source;
      for (const button of document.querySelectorAll('[data-article-id]')) {
        button.setAttribute('aria-current', String(button.dataset.articleId === id));
      }
      if (focus) get('reader').focus();
    }

    function renderList(kind) {
      const items = articles.filter(article => article.kind === kind);
      get(kind + '-empty').hidden = items.length > 0;
      get(kind + '-list').replaceChildren(...items.map(article => {
        const row = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.articleId = article.id;
        button.textContent = article.title;
        if (article.simulated_at) {
          const date = document.createElement('span');
          date.className = 'date';
          date.textContent = clock.format(new Date(article.simulated_at));
          button.append(date);
        }
        button.addEventListener('click', () => {
          const url = new URL(location.href);
          url.searchParams.set('article', article.id);
          history.replaceState(null, '', url);
          openArticle(article.id, true);
        });
        row.append(button);
        return row;
      }));
    }

    async function loadArticles() {
      if (location.protocol === 'file:') {
        articles = VoteDrafts.approved().map(entry => ({...entry, simulated_at: entry.frame.simulated_at}));
      } else {
        try {
          const response = await fetch('/api/articles');
          if (!response.ok) throw new Error();
          const archive = await response.json();
          articles = [...archive.vote, ...archive.housing];
        } catch {
          get('archive-status').textContent = '기사 목록을 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
        }
      }
      for (const group of groups) renderList(group);
      const requested = new URLSearchParams(location.search).get('article');
      openArticle(requested || articles[0]?.id);
    }
    loadArticles();
  </script>
</body>
</html>
