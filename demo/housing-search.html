<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울시장 주거 공약 근거 검색</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#15253b;background:#edf3fa}
    body{max-width:1040px;margin:32px auto;padding:0 20px}
    a{color:#15476e} h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:12px 0}
    section,article{background:white;border:1px solid #d4dce6;border-radius:12px;padding:20px;margin:16px 0}
    label{display:block;font-weight:700;margin:12px 0 6px}
    input,select,button{box-sizing:border-box;font:inherit;padding:11px;border-radius:6px}
    input,select{border:1px solid #9cabbc;width:100%;background:white}
    input[type="checkbox"]{width:auto}
    button{background:#16466d;color:white;border:0;cursor:pointer;align-self:end}
    button:disabled{background:#728297;cursor:wait}
    .controls{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:14px}
    .muted{font-size:.9rem;color:#45566a;line-height:1.6}
    .pending{background:#fff6e6;border:1px solid #dfca9e;border-radius:8px;padding:14px;margin-top:14px}
    .pending[hidden]{display:none}
    .badge{font-size:.8rem;background:#fff0ca;padding:3px 8px;border-radius:4px}
    .citation{font-weight:700;color:#16466d;overflow-wrap:anywhere}
    .links{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
    h2{font-size:1.15rem;margin:0 0 8px}
    blockquote{border-left:3px solid #bacfe0;margin:14px 0;padding:8px 14px;line-height:1.7}
    pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:.9rem;line-height:1.7}
    summary{cursor:pointer;font-weight:650;margin-top:14px}
    :focus-visible{outline:3px solid #0866ac;outline-offset:3px}
    @media(max-width:560px){body{padding:0 12px;margin:20px auto}.controls{grid-template-columns:1fr}section,article{padding:16px}}
  </style>
</head>
<body>
  <a href="/">개표 데스크로 돌아가기</a>
  <h1>주거 공약 근거 검색</h1>
  <p class="muted">기존 수집 공약 일부와 교육용 공약에서 관련 근거를 찾습니다. PDF 첫 페이지를 1쪽으로 셉니다.</p>
  <section aria-label="근거 검색">
    <form id="search-form">
      <label for="question">기사 질문</label>
      <input id="question" name="q" maxlength="500" required
        value="2026년 서울시장 후보들은 주거 문제 해결을 위해 어떤 공약을 제시했나?">
      <div class="controls">
        <div>
          <label for="candidate">후보</label>
          <select id="candidate"><option value="">전체 후보</option></select>
        </div>
        <label><input type="checkbox" id="include-withdrawn"> 사퇴 후보 포함</label>
          <button id="submit" type="submit" disabled>근거 검색</button>
          <button id="generate" type="button" disabled>질문으로 기사 초안 만들기</button>
      </div>
    </form>
    <p id="dataset-status" class="muted">검색 자료를 확인하고 있습니다.</p>
    <p class="muted">기사 초안은 질문에 맞는 원문을 검색·발췌해 새로 작성합니다. 외부 AI의 문장 재작성은 사용하지 않습니다. 현재 범위는 주거 공약이며 원문에 없는 내용은 만들지 않습니다.</p>
    <div id="pending" class="pending" role="status" hidden></div>
  </section>
  <p id="search-status" role="status" aria-live="polite"></p>
  <div id="results"></div>
  <p id="generation-status" role="status" aria-live="polite"></p>
  <section id="generated-article" hidden>
    <h2 id="generated-title"></h2>
    <p id="generated-question"></p>
    <p id="generated-notice" class="muted"></p>
    <ol id="generated-sentences"></ol>
    <p id="generated-validation"></p>
    <a id="review-generated">이 초안 검토·승인하기</a>
  </section>
  <section>
    <h2>저장된 초안</h2>
    <button id="refresh-drafts" type="button">저장 목록 새로고침</button>
    <ul id="saved-drafts"></ul>
  </section>
  <script>
    const byId = id => document.getElementById(id);
    let latestRequest = 0;
    function text(tag, value, className) {
      const node = document.createElement(tag);
      node.textContent = value;
      if (className) node.className = className;
      return node;
    }
    function sourceLink(label, url) {
      const link = text('a', label);
      const parsed = new URL(url, location.href);
      if (parsed.protocol !== 'https:' && !(parsed.origin === location.origin && parsed.pathname.startsWith('/sources/'))) throw new Error('출처 주소를 확인해 주세요.');
      link.href = parsed.href;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      return link;
    }
    async function getJSON(url) {
      const response = await fetch(url, {headers: {'Accept': 'application/json'}});
      const data = await response.json();
      if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : data.detail?.message || '검색 요청을 확인해 주세요.');
      return data;
    }
    function renderResults(data) {
      const target = byId('results');
      target.replaceChildren();
      for (const result of data.results) {
        const card = document.createElement('article');
        const heading = text('h2', result.candidate);
        if (result.candidate_withdrawn) {
          heading.append(' ', text('span', '사퇴', 'badge'));
        }
        card.append(heading, text('p', result.summary));
        card.append(text('p', result.citation, 'citation'));
        card.append(text('blockquote', result.evidence_text));
        card.append(text('p', '/ 는 떨어진 근거 구절을 구분합니다. 후보가 제시한 공약 내용입니다.', 'muted'));
        const links = text('div', '', 'links');
        links.append(sourceLink('원문 PDF 보기', result.stored_pdf_url));
        if (result.document_registry_url) links.append(sourceLink('공약자료목록', result.document_registry_url));
        if (result.source_site_url) links.append(sourceLink('공식 수집처 사이트', result.source_site_url));
        card.append(links);
        const detail = document.createElement('details');
        detail.append(text('summary', '검색 근거 본문 보기'), text('pre', result.text));
        card.append(detail);
        target.append(card);
      }
      const pending = data.coverage.pending_evidence;
      const notice = byId('pending');
      notice.replaceChildren();
      notice.hidden = !pending.length;
      if (pending.length) {
        notice.append(text('strong', '검색에 포함하지 못한 근거'));
        for (const item of pending) {
          const line = text('p', item.candidate + ' · ' + item.document_id + ' — ' + item.reason);
          line.append(' ', sourceLink('PDF 확인', item.stored_pdf_url));
          notice.append(line);
        }
      }
      const names = data.coverage.returned_candidates;
      byId('search-status').textContent = data.results.length
        ? names.join('·') + ' 후보의 근거 ' + data.results.length + '개를 찾았습니다.'
        : '이번 검색에서 일치하는 근거를 찾지 못했습니다. 해당 후보에게 공약이 없다는 뜻은 아닙니다.';
    }
    async function search(event) {
      if (event) event.preventDefault();
      const request = ++latestRequest;
      const button = byId('submit');
      button.disabled = true;
      byId('search-status').textContent = '관련 근거를 검색하고 있습니다.';
      const params = new URLSearchParams({
        q: byId('question').value,
        candidate: byId('candidate').value,
        limit: '10', include_withdrawn: String(byId('include-withdrawn').checked)
      });
      try {
        const data = await getJSON('/api/housing/search?' + params);
        if (request === latestRequest) renderResults(data);
      } catch (error) {
        if (request === latestRequest) {
          byId('results').replaceChildren();
          byId('pending').hidden = true;
          byId('search-status').textContent = error.message || '검색 서버 연결을 확인해 주세요.';
        }
      } finally {
        if (request === latestRequest) button.disabled = false;
      }
    }
    byId('search-form').addEventListener('submit', search);
    async function initialize() {
      try {
        const data = await getJSON('/api/housing/status');
        byId('question').value = data.question;
        byId('dataset-status').textContent =
          '검색 근거 ' + data.ready_chunks + '개 · 확인 대기 ' + data.pending_chunks + '개 · 자료 준비일 ' + data.prepared_date_kst;
        for (const item of data.candidate_options) {
          const option = text('option', item.name + (item.withdrawn ? ' (사퇴)' : '') +
            (item.ready_chunks ? '' : ' · 근거 확인 대기'));
          option.value = item.name;
          byId('candidate').append(option);
        }
        byId('submit').disabled = false;
        byId('generate').disabled = false;
        await search();
      } catch (error) {
        byId('dataset-status').textContent = '검색 자료를 불러오지 못했습니다. ' + error.message;
      }
    }
    initialize();
    async function loadSavedDrafts() {
      const target=byId('saved-drafts'); target.replaceChildren();
      try {
        const drafts=await getJSON('/api/housing-review/drafts');
        for (const draft of drafts) {
          const row=document.createElement('li');
          const link=document.createElement('a');
          link.textContent=(draft.created_at ? new Date(draft.created_at).toLocaleString('ko-KR')+' · ' : '')+(draft.question || draft.title)+' · '+draft.status;
          link.href='/housing-review?draft_id='+encodeURIComponent(draft.id);
          row.append(link); target.append(row);
        }
        if (!drafts.length) target.append(text('li','저장된 초안이 없습니다.'));
      } catch (error) { target.append(text('li','목록을 불러오지 못했습니다. '+error.message)); }
    }
    byId('refresh-drafts').addEventListener('click',loadSavedDrafts);
    byId('generate').addEventListener('click',async () => {
      const button=byId('generate'); button.disabled=true;
      byId('generated-article').hidden=true;
      byId('generation-status').textContent='질문에 맞는 근거로 초안을 만들고 저장하고 있습니다.';
      try {
        const response=await fetch('/api/housing/generate',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({question:byId('question').value,candidate:byId('candidate').value,
            include_withdrawn:byId('include-withdrawn').checked})});
        const draft=await response.json();
        if (!response.ok) throw new Error(draft.detail?.message || (typeof draft.detail==='string' ? draft.detail : '질문과 후보 선택을 확인해 주세요.'));
        byId('generated-title').textContent=draft.title;
        byId('generated-question').textContent='질문: '+draft.question;
        byId('generated-notice').textContent=draft.generation_notice+' '+draft.review_notice;
        byId('generated-sentences').replaceChildren(...draft.sentences.map(row => {
          const item=text('li',row.sentence+' ');
          item.append(sourceLink('원문 PDF',row.stored_pdf_url)); return item;
        }));
        byId('generated-validation').textContent=draft.validation.can_approve ?
          '원문·후보·인용 일치 검사 통과 · 사람 검토 전' : draft.validation.issues.map(x=>x.message).join(' / ');
        byId('review-generated').href=draft.review_url;
        byId('generated-article').hidden=false;
        byId('generation-status').textContent='새 초안을 DB에 저장했습니다. 새로고침 후에도 저장 목록에서 열 수 있습니다.';
        await loadSavedDrafts();
      } catch (error) { byId('generation-status').textContent=error.message; }
      finally { button.disabled=false; }
    });
    loadSavedDrafts();
  </script>
</body>
</html>
