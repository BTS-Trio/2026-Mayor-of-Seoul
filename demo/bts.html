<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamite와 Butter의 영국 싱글 차트 첫 3주</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f6f3fc; color: #211837; font: 16px/1.6 Inter, "Malgun Gothic", sans-serif; }
main { max-width: 880px; margin: auto; padding: clamp(24px, 7vw, 80px) 20px; }
h1 { max-width: 720px; font-size: clamp(26px, 5vw, 44px); line-height: 1.25; margin: 0 0 24px; }
nav { display: flex; gap: 8px; margin-bottom: 20px; }
button { font: inherit; font-weight: bold; border: 1px solid #b8abd1; background: white; color: #32204f; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
button[aria-pressed="true"] { background: #412675; color: white; border-color: #412675; }
section { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
article { padding: clamp(12px, 4vw, 28px); background: white; border-radius: 16px; border: 1px solid #ded5ef; }
h2 { margin: 0; font-size: clamp(18px, 4vw, 27px); }
.rank { display: block; font-size: clamp(32px, 7vw, 60px); font-weight: 800; color: #412675; margin-bottom: 10px; }
a { color: #523182; text-underline-offset: 4px; }
:focus-visible { outline: 3px solid #8864bf; outline-offset: 3px; }
p { color: #514663; }
</style>
<main>
  <h1>Dynamite와 Butter의 영국 싱글 차트 첫 3주</h1>
  <nav aria-label="비교할 주차">
    <button type="button" aria-pressed="true">1주차</button>
    <button type="button" aria-pressed="false">2주차</button>
    <button type="button" aria-pressed="false">3주차</button>
  </nav>
  <section aria-label="두 곡의 순위">
    <article>
      <h2>Dynamite</h2>
      <strong class="rank" aria-live="polite">3위</strong>
      <a target="_blank" rel="noopener" href="https://www.officialcharts.com/charts/singles-chart/20200828/7501/" aria-label="Dynamite 1주차 공식 주간표 보기 (새 탭)">공식 주간표 보기 ↗</a>
    </article>
    <article>
      <h2>Butter</h2>
      <strong class="rank" aria-live="polite">3위</strong>
      <a target="_blank" rel="noopener" href="https://www.officialcharts.com/charts/singles-chart/20210528/7501/" aria-label="Butter 1주차 공식 주간표 보기 (새 탭)">공식 주간표 보기 ↗</a>
    </article>
  </section>
  <p>각 곡이 영국 차트에 처음 진입한 주를 1주차로 맞춰 비교했습니다.</p>
</main>
<script>
const weeks = [
  [[3, '20200828'], [3, '20210528']],
  [[13, '20200904'], [7, '20210604']],
  [[18, '20200911'], [13, '20210611']],
];
const buttons = [...document.querySelectorAll('nav button')];
const cards = [...document.querySelectorAll('article')];
const chartBase = 'https://www.officialcharts.com/charts/singles-chart';

function showWeek(weekIndex) {
  buttons.forEach((button, index) => {
    button.setAttribute('aria-pressed', String(index === weekIndex));
  });
  cards.forEach((card, songIndex) => {
    const [rank, date] = weeks[weekIndex][songIndex];
    const song = card.querySelector('h2').textContent;
    const link = card.querySelector('a');
    card.querySelector('.rank').textContent = rank + '위';
    link.href = chartBase + '/' + date + '/7501/';
    link.setAttribute('aria-label', song + ' ' + (weekIndex + 1) + '주차 공식 주간표 보기 (새 탭)');
  });
}

buttons.forEach((button, index) => {
  button.addEventListener('click', () => showWeek(index));
});
</script>
</html>
