<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개표 기사 초안 검토</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eaf3ff;background:#071025;color-scheme:dark}*{box-sizing:border-box}body{max-width:1040px;margin:32px auto;padding:0 22px}a{color:#70e4f6}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:30px}section{border:1px solid #3c5675;border-radius:14px;padding:24px;background:#101c32;margin:18px 0}.muted{font-size:14px;color:#a8bad1}.draft{background:#f8edda;color:#171614;padding:22px;border-radius:10px;font-family:Batang,serif;line-height:1.8}.draft h2{font-size:27px;margin:0 0 10px}.draft p{font-size:20px}.source{font-family:system-ui;font-size:13px!important;overflow-wrap:anywhere}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;border:1px solid #65d7e8;background:#08c9dd;color:#021c25;font-weight:700;padding:10px 25px;border-radius:8px;cursor:pointer}button.secondary{background:#16243a;color:#ffe2a9;border-color:#e0b76c}button:disabled{opacity:.4;cursor:not-allowed}textarea{display:block;width:100%;font:inherit;background:#091327;color:#fff;border:1px solid #53708b;border-radius:8px;padding:12px;margin:8px 0 18px}.check{padding:14px;border-radius:8px;background:#1b2941}.check[data-outcome=pass]{background:#123c35;color:#a0f3d4}.check[data-outcome=fail]{background:#541e30;color:#ffd3db}dl{display:flex;flex-wrap:wrap;gap:15px 30px}dd{margin:4px 0}dt{font-size:13px;color:#a8bad1}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffe48c;outline-offset:4px}@media(max-width:600px){body{padding:0 12px}header{display:block}section{padding:16px}.draft h2{font-size:23px}.draft p{font-size:18px}}
</style></head><body>
<header><h1>개표 기사 초안 검토</h1><a id="home-link" href="index.html">홈페이지로 돌아가기</a></header>
<p class="muted">자동 생성된 모의 개표 기사를 집계 근거와 대조하고 승인하거나 반려합니다. 초안과 결과는 현재 브라우저 탭에 저장됩니다.</p>
<section><label for="draft-list">검토할 기사</label> <select id="draft-list"></select></section><section><article class="draft"><h2 id="draft-title">기사 초안 대기</h2><p id="draft-body">홈페이지에서 모의 개표를 시작하면 자동 생성된 초안이 표시됩니다.</p><p id="draft-source" class="source">집계 근거 대기</p></article><dl><div><dt>기준 시각</dt><dd id="snapshot-time">—</dd></div><div><dt>후보 근거</dt><dd id="candidate-row">—</dd></div><div><dt>집계 득표수</dt><dd id="actual-votes">—</dd></div></dl></section>
<section aria-labelledby="validation-heading"><h2 id="validation-heading">검증 결과</h2><label><input id="inject-error" type="checkbox" disabled> 득표수 오류 넣기 (+100표)</label><p id="review-check" class="check" role="status">검증 대기</p><label for="review-note">반려 사유</label><textarea id="review-note" rows="3" disabled placeholder="기사 속 득표수와 집계 근거가 일치하는지 확인해 주세요."></textarea><div class="actions"><button id="approve" disabled>승인</button><button id="reject" class="secondary" disabled>반려</button><a href="housing-review.html" id="housing-link">공약 기사 검증·승인 이력</a></div><p id="review-state" role="status">검토 대기</p></section>
<script src="vote-drafts.js"></script>
<script>
const get = id => document.getElementById(id);
const set = (id, value) => { get(id).textContent = value; };
const number = new Intl.NumberFormat('ko-KR');
const picker = get('draft-list');
let drafts = VoteDrafts.list();
let selected;

function refresh() {
  selected = drafts.find(entry => entry.id === picker.value);
  if (!selected) return;
  const testedVotes = selected.votes + (get('inject-error').checked ? 100 : 0);
  const ok = VoteDrafts.valid(selected, testedVotes);
  const pending = selected.status === 'pending';
  set('draft-title', selected.title);
  set('draft-body', selected.body.replace(number.format(selected.votes) + '표', number.format(testedVotes) + '표'));
  set('draft-source', selected.source);
  set('snapshot-time', selected.time);
  set('candidate-row', selected.frame.candidates.find(candidate => candidate.votes === selected.votes)?.row_id || '—');
  set('actual-votes', number.format(Math.max(...selected.frame.candidates.map(candidate => candidate.votes))) + '표');
  set('review-check', ok ? '통과 · 초안의 선두 득표수가 집계와 일치합니다.' : '불일치 · 검증 대상 ' + number.format(testedVotes) + '표. 승인할 수 없습니다.');
  get('review-check').dataset.outcome = ok ? 'pass' : 'fail';
  get('approve').disabled = !pending || !ok;
  for (const id of ['reject', 'inject-error', 'review-note']) get(id).disabled = !pending;
  const label = { pending: '검토 대기', approved: '승인 완료', rejected: '반려 완료' };
  set('review-state', label[selected.status] + (selected.note ? ' · ' + selected.note : ''));
}

function decide(status) {
  if (!selected) return;
  const note = get('review-note').value.trim();
  if (status === 'rejected' && !note) {
    set('review-state', '반려 사유를 입력해 주세요.');
    get('review-note').focus();
    return;
  }
  const votes = selected.votes + (get('inject-error').checked ? 100 : 0);
  if (!VoteDrafts.decide(selected, status, note, votes)) return;
  get('inject-error').checked = false;
  refresh();
}
function loadDrafts() {
  const previous = picker.value;
  drafts = VoteDrafts.list();
  picker.replaceChildren(...[...drafts].reverse().map(entry => new Option(entry.title, entry.id)));
  if (drafts.some(entry => entry.id === previous)) picker.value = previous;
  picker.disabled = !drafts.length;
  refresh();
}

picker.addEventListener('change', () => {
  get('inject-error').checked = false;
  get('review-note').value = '';
  refresh();
});
get('inject-error').addEventListener('change', refresh);
get('approve').addEventListener('click', () => decide('approved'));
get('reject').addEventListener('click', () => decide('rejected'));
window.addEventListener('pageshow', loadDrafts);
loadDrafts();
</script></body></html>
