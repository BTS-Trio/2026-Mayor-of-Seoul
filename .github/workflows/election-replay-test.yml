name: Election replay integration

on:
  push:
    branches: [feat/heum-editor-dashboard]
    paths:
      - demo/**
      - .github/workflows/election-replay-test.yml

permissions:
  contents: read

jobs:
  two-servers:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run replay and outage tests
        run: python -m unittest -v
